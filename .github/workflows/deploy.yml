name: Deploy to Sprinthost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Удаляем файл состояния через curl (FTP)
      - name: Delete sync state file
        run: |
          curl -v --ftp-method nocwd \
            -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_SERVER }}/domains/f1316434.xsph.ru/public_html/.ftp-deploy-sync-state.json" \
            -Q "DELE /domains/f1316434.xsph.ru/public_html/.ftp-deploy-sync-state.json" || true

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /domains/f1316434.xsph.ru/public_html/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
