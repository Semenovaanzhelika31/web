name: Deploy to Sprinthost

on:
  push:
  branches:
    - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sprinthost
  cancel-in-progress: false

jobs:
  deploy:
  name: Upload website via FTP
  runs-on: ubuntu-latest
  
  steps:
  - name: Checkout repository
  uses: actions/checkout@v6
  with:
    persist-credentials: false
  name: Deploy website
  uses: SamKirkland/FTP-Deploy-Action@v4.4.0
  with:
  server: ${{ secrets.FTP_USERNAME }}.xsph.ru
  username: ${{ secrets.FTP_USERNAME }}
  password: ${{ secrets.FTP_PASSWORD }}

  protocol: ftp
  port: 21

  local-dir: ./

  server-dir: ./domains/${{ secrets.FTP_USERNAME }}.xsph.ru/public_html/

  exclude: |
    **/.git*
    **/.git*/**
    **/node_modules/**
    **/.env
    **/.env.*
    **/README*
